name: Deploy frontend-next to Production

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'public/**'
      - 'middleware.ts'
      - 'package*.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'Dockerfile'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-frontend-next.yml'

  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # Quality checks — type-check + lint
  # ============================================================
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

  # ============================================================
  # Deploy — rsync source + build on server
  # ============================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://linkchart.app

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Sync source files to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env*' \
            . root@${{ secrets.PRODUCTION_HOST }}:/var/www/linkchart-frontend-next/

      - name: Build and start container on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          # API_URL is a server-only runtime env var (not a build arg).
          # NEXT_PUBLIC_API_URL secret is reused as the source value — rename the
          # GitHub Secret to API_URL when convenient.
          envs: API_URL,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_GA_ID,NEXT_PUBLIC_ADSENSE_CLIENT
          script: |
            set -e
            cd /var/www/linkchart-frontend-next

            echo "Stopping existing container..."
            docker compose -f docker-compose.prod.yml down --remove-orphans || true

            echo "Building and starting container..."
            NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            NEXT_PUBLIC_GA_ID="$NEXT_PUBLIC_GA_ID" \
            NEXT_PUBLIC_ADSENSE_CLIENT="$NEXT_PUBLIC_ADSENSE_CLIENT" \
            API_URL="$API_URL" \
            docker compose -f docker-compose.prod.yml up --build -d

            echo "Waiting for container startup..."
            sleep 15

            echo "Running health check..."
            attempt=1
            until curl -sf http://localhost:3000/api/health; do
              if [ $attempt -ge 5 ]; then
                echo "Health check failed after $attempt attempts"
                docker compose -f docker-compose.prod.yml logs --tail=50
                exit 1
              fi
              echo "Attempt $attempt failed, retrying in 10s..."
              attempt=$((attempt + 1))
              sleep 10
            done
            echo "Health check passed on attempt $attempt"

            echo "Cleaning up unused Docker images..."
            docker image prune -f

            echo "Deploy complete."
        env:
          # API_URL: server-only backend URL for Next.js proxy rewrites and SSR fetches.
          # Maps to the existing NEXT_PUBLIC_API_URL secret value until secret is renamed.
          API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT }}
