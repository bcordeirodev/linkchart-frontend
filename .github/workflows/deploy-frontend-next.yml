name: Deploy frontend-next to Production

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "middleware.ts"
      - "package*.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "Dockerfile"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-frontend-next.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  # ============================================================
  # Quality checks — type-check + lint + build
  # ============================================================
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build (catch build-time errors before deploy)
        env:
          NEXT_PUBLIC_APP_URL: https://linkcharts.com.br
          API_URL: http://localhost:8000
        run: npm run build

  # ============================================================
  # Deploy — rsync source + build on server
  # ============================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://linkchart.app

    steps:
      - uses: actions/checkout@v6

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Sync source files to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env.local' \
            --exclude='.env' \
            . root@${{ secrets.PRODUCTION_HOST }}:/var/www/linkchart-frontend-next/

      - name: Write production secrets to server
        run: |
          # Strip stray whitespace/newlines so a pasted trailing space can't
          # corrupt the API key value in the server .env.
          GSB_KEY=$(printf '%s' "${{ secrets.GOOGLE_SAFE_BROWSING_KEY }}" | tr -d '[:space:]')
          {
            echo "AUTH0_CLIENT_SECRET=${{ secrets.AUTH0_CLIENT_SECRET }}"
            echo "AUTH0_SECRET=${{ secrets.AUTH0_SECRET }}"
            echo "GOOGLE_SAFE_BROWSING_KEY=$GSB_KEY"
          } | ssh root@${{ secrets.PRODUCTION_HOST }} "cat > /var/www/linkchart-frontend-next/.env"

      - name: Build and start container on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            cd /var/www/linkchart-frontend-next

            echo "Trimming Docker build cache to 2 GB..."
            docker builder prune --keep-storage 2g -f

            echo "Stopping existing container..."
            docker compose -f docker-compose.prod.yml down --remove-orphans || true

            echo "Building and starting container..."
            docker compose -f docker-compose.prod.yml up --build -d

            echo "Waiting for container startup..."
            sleep 25

            echo "Running health check..."
            attempt=1
            until curl -sf http://localhost:3000/api/health; do
              if [ $attempt -ge 5 ]; then
                echo "Health check failed after $attempt attempts"
                docker compose -f docker-compose.prod.yml logs --tail=50
                exit 1
              fi
              echo "Attempt $attempt failed, retrying in 10s..."
              attempt=$((attempt + 1))
              sleep 10
            done
            echo "Health check passed on attempt $attempt"

            echo "Cleaning up unused Docker images..."
            docker image prune -f

            echo "Deploy complete."
