name: Release frontend

# Deploy INTENCIONAL: dispara por tag `v*` ou manualmente. Push em `main` roda
# apenas o ci.yml — merge deixou de significar deploy.
#
# A imagem e construida AQUI (runner: 4 vCPU / 16 GB) e publicada no GHCR.
# O droplet (2 vCPU / 3,8 GB, sem swap) so faz `docker pull` + swap blue/green:
# nunca mais compila enquanto serve trafego.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag ou SHA para deployar (use para rollback, ex.: v1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-frontend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bcordeirodev/linkchart-frontend
  DEPLOY_HOST: 134.209.33.182
  PROJECT_PATH: /var/www/linkchart-frontend-next

jobs:
  # ==========================================================================
  # Build da imagem NO RUNNER — nunca no droplet de producao
  # ==========================================================================
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.meta.outputs.sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolver a tag da imagem
        id: meta
        run: |
          SHA=$(git rev-parse --short=12 HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "git_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "git_tag=" >> "$GITHUB_OUTPUT"
          fi
          echo "Imagem sera publicada como: $SHA"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # As build args NEXT_PUBLIC_* sao avaliadas em BUILD TIME pelo Next e
      # ficam gravadas no bundle. Ate 2026-07-13 varias eram lidas pelo codigo
      # mas nunca passadas aqui — compilavam vazias em producao. Efeito colateral:
      # o `send_to` do gtag saia como string vazia e NENHUMA conversao do Google
      # Ads era registrada. Manter esta lista sincronizada com os
      # `process.env.NEXT_PUBLIC_*` referenciados em src/ e app/.
      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE }}:latest
            ${{ steps.meta.outputs.git_tag && format('{0}:{1}', env.IMAGE, steps.meta.outputs.git_tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=https://linkcharts.com.br
            NEXT_PUBLIC_REDIRECT_URL=https://redirect.linkcharts.com.br
            NEXT_PUBLIC_GOOGLE_ADS_ID=AW-18126255245
            NEXT_PUBLIC_ADSENSE_PUBLISHER_ID=ca-pub-1396026257166470
            NEXT_PUBLIC_SUBDOMAINS_ENABLED=true
            NEXT_PUBLIC_FARO_URL=https://faro-collector-prod-sa-east-1.grafana.net/collect/01e9dc26e022b00b11c49c286fcdc03d
            NEXT_PUBLIC_FARO_APP_NAME=linkcharts-frontend
            NEXT_PUBLIC_FARO_APP_VERSION=${{ steps.meta.outputs.sha }}
            NEXT_PUBLIC_FARO_ENVIRONMENT=production
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_GADS_CONV_SHORTEN=${{ vars.NEXT_PUBLIC_GADS_CONV_SHORTEN }}
            NEXT_PUBLIC_GADS_CONV_SIGNUP=${{ vars.NEXT_PUBLIC_GADS_CONV_SIGNUP }}
            NEXT_PUBLIC_ADSENSE_SLOT_SHORTER_BELOW_FORM=${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_SHORTER_BELOW_FORM }}
            NEXT_PUBLIC_ADSENSE_SLOT_SHORTER_BETWEEN_SECTIONS=${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_SHORTER_BETWEEN_SECTIONS }}
            NEXT_PUBLIC_ADSENSE_SLOT_ANALYTICS_ABOVE_CHARTS=${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_ANALYTICS_ABOVE_CHARTS }}
            NEXT_PUBLIC_ADSENSE_SLOT_ANALYTICS_BELOW_CHARTS=${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_ANALYTICS_BELOW_CHARTS }}
            API_URL=http://linkchartapi:80

  # ==========================================================================
  # Deploy — o droplet so faz pull + swap blue/green
  # ==========================================================================
  deploy:
    name: Deploy (blue/green)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    environment:
      name: production
      url: https://linkcharts.com.br

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      # Envia SO os artefatos de deploy. O codigo-fonte nao vai mais para o
      # servidor: quem roda e a imagem. Isso evita a armadilha de alguem editar
      # um arquivo no droplet e nao entender por que nada muda.
      # Dois rsync de proposito: um arquivo listado individualmente e copiado
      # ACHATADO no destino (scripts/deploy.sh viraria /path/deploy.sh). Para
      # preservar `scripts/`, o diretorio precisa ser sincronizado como diretorio.
      - name: Enviar compose + script de deploy
        run: |
          rsync -az docker-compose.prod.yml \
            root@${{ env.DEPLOY_HOST }}:${{ env.PROJECT_PATH }}/
          rsync -az scripts/ \
            root@${{ env.DEPLOY_HOST }}:${{ env.PROJECT_PATH }}/scripts/

      - name: Escrever os secrets de runtime no servidor
        run: |
          # Remove espacos/quebras acidentais: um espaco no fim corromperia o valor.
          GSB_KEY=$(printf '%s' "${{ secrets.GOOGLE_SAFE_BROWSING_KEY }}" | tr -d '[:space:]')
          {
            echo "AUTH0_CLIENT_SECRET=${{ secrets.AUTH0_CLIENT_SECRET }}"
            echo "AUTH0_SECRET=${{ secrets.AUTH0_SECRET }}"
            echo "GOOGLE_SAFE_BROWSING_KEY=$GSB_KEY"
          } | ssh root@${{ env.DEPLOY_HOST }} "cat > ${{ env.PROJECT_PATH }}/.env"

      # Login EFEMERO no GHCR: o GITHUB_TOKEN morre com o job. Assim o droplet
      # nao guarda nenhuma credencial de longa duracao para o registry.
      - name: Login no GHCR a partir do servidor
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh root@${{ env.DEPLOY_HOST }} \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Executar o swap blue/green
        run: |
          ssh root@${{ env.DEPLOY_HOST }} \
            "chmod +x ${{ env.PROJECT_PATH }}/scripts/deploy.sh && \
             IMAGE_TAG='${{ needs.build.outputs.image_tag }}' \
             ${{ env.PROJECT_PATH }}/scripts/deploy.sh"

      - name: Logout do GHCR
        if: always()
        run: |
          ssh root@${{ env.DEPLOY_HOST }} "docker logout ghcr.io" || true

      - name: Health check publico (de fora do servidor)
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://linkcharts.com.br/api/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "Deploy confirmado (HTTP 200)"
              exit 0
            fi
            echo "tentativa $i: HTTP $code — nova tentativa em 5s"
            sleep 5
          done
          echo "Health check publico falhou"
          exit 1
