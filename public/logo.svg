<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <radialGradient id="topHighlight" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="roundedClip">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <g clip-path="url(#roundedClip)">
    <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
      <line x1="0" y1="128" x2="512" y2="128"/>
      <line x1="0" y1="256" x2="512" y2="256"/>
      <line x1="0" y1="384" x2="512" y2="384"/>
      <line x1="128" y1="0" x2="128" y2="512"/>
      <line x1="256" y1="0" x2="256" y2="512"/>
      <line x1="384" y1="0" x2="384" y2="512"/>
    </g>

    <g fill="#ffffff" fill-opacity="0.18">
      <rect x="78"  y="320" width="56" height="92"  rx="8"/>
      <rect x="166" y="248" width="56" height="164" rx="8"/>
      <rect x="254" y="288" width="56" height="124" rx="8"/>
      <rect x="342" y="184" width="56" height="228" rx="8"/>
    </g>

    <path d="M 80 360 L 194 248 L 282 304 L 416 152 L 416 412 L 80 412 Z"
          fill="url(#areaFill)"/>

    <rect width="512" height="512" fill="url(#topHighlight)"/>

    <path d="M 80 360 L 194 248 L 282 304 L 416 152"
          fill="none" stroke="url(#lineGrad)" stroke-width="32"
          stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="80"  cy="360" r="44" fill="url(#dotGlow)"/>
    <circle cx="194" cy="248" r="44" fill="url(#dotGlow)"/>
    <circle cx="282" cy="304" r="44" fill="url(#dotGlow)"/>
    <circle cx="416" cy="152" r="52" fill="url(#dotGlow)"/>

    <g fill="#ffffff">
      <circle cx="80"  cy="360" r="22"/>
      <circle cx="194" cy="248" r="22"/>
      <circle cx="282" cy="304" r="22"/>
      <circle cx="416" cy="152" r="28"/>
    </g>
    <g fill="#1e40af">
      <circle cx="80"  cy="360" r="9"/>
      <circle cx="194" cy="248" r="9"/>
      <circle cx="282" cy="304" r="9"/>
      <circle cx="416" cy="152" r="12"/>
    </g>
  </g>
</svg>
