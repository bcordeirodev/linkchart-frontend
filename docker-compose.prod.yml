# Compose de producao do frontend.
#
# A imagem vem PRONTA do GHCR (construida no CI) — nao ha bloco `build:`.
# O droplet e 2 vCPU / 3,8 GB e nao deve compilar nada enquanto serve trafego.
# As build args (NEXT_PUBLIC_*) agora vivem em .github/workflows/release.yml.
#
# Variaveis obrigatorias (injetadas por scripts/deploy.sh):
#   IMAGE_TAG  tag da imagem no GHCR (SHA curto do commit)
#   COLOR      blue | green — identifica o container
#   APP_PORT   3000 (blue) | 3001 (green) — porta publicada no host
#
# A cor ativa e definida por /etc/nginx/conf.d/upstreams.conf no host.

services:
  frontend-next:
    image: ghcr.io/bcordeirodev/linkchart-frontend:${IMAGE_TAG:?IMAGE_TAG obrigatorio}
    container_name: linkcharts-frontend-${COLOR:?COLOR obrigatorio}
    restart: always
    ports:
      # Publica so em 127.0.0.1: quem termina TLS e serve a internet e o nginx
      # do host. Antes era 0.0.0.0:3000, exposto na internet sem necessidade.
      - "127.0.0.1:${APP_PORT:?APP_PORT obrigatorio}:3000"
    networks:
      # Rede externa compartilhada com o backend: e ela que da o DNS de
      # `linkchartapi`, usado por API_URL. Sem ela o frontend nao fala com a API.
      - linkcharts-network
    environment:
      - NODE_ENV=production
      - API_URL=http://linkchartapi:80
      - GOOGLE_SAFE_BROWSING_KEY
      - HOSTNAME=0.0.0.0
      # Auth0 — server-side only, nunca vai para o bundle do cliente
      - APP_BASE_URL=https://linkcharts.com.br
      - AUTH0_DOMAIN=login.linkcharts.com.br
      - AUTH0_CLIENT_ID=ynlcwMzBjCPt3qzTRLv4VyP5CkgSREzD
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_SECRET=${AUTH0_SECRET}
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  linkcharts-network:
    external: true
