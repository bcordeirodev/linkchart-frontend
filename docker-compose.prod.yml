version: '3.8'
services:
  frontend-next:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* vars are baked into the client bundle at build time.
        # API_URL is intentionally NOT a build arg — it's a runtime env var used
        # only by the Next.js server (proxy rewrites, SSR fetches). Client code
        # uses relative /api/* paths, so no CORS and no URL hardcoded in the bundle.
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}
        - NEXT_PUBLIC_ADSENSE_CLIENT=${NEXT_PUBLIC_ADSENSE_CLIENT}
    container_name: linkcharts-frontend-next-prod
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      # API_URL: backend URL for Next.js server-side proxy and SSR fetches.
      # In production this points to the internal/proxy backend URL.
      - API_URL=${API_URL}
      # Server-only runtime secrets (not baked into client bundle)
      - GOOGLE_SAFE_BROWSING_KEY=${GOOGLE_SAFE_BROWSING_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
