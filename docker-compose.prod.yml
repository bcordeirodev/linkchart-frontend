version: '3.8'
services:
  frontend-next:
    build:
      context: .
      args:
        - NEXT_PUBLIC_APP_URL=https://linkcharts.com.br
        - NEXT_PUBLIC_GA_ID=G-C06GRDGSW1
        - NEXT_PUBLIC_ADSENSE_CLIENT=ca-pub-1396026257166470
        # API_URL é build arg porque next.config.ts rewrites() é avaliado em build time
        - API_URL=http://linkchartapi:80
    container_name: linkcharts-frontend-next-prod
    restart: always
    ports:
      - '3000:3000'
    networks:
      - frontend-net
      - linkcharts-network
    environment:
      - NODE_ENV=production
      - API_URL=http://linkchartapi:80
      - GOOGLE_SAFE_BROWSING_KEY=REDACTED_GSB_KEY
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  frontend-net:
    driver: bridge
  linkcharts-network:
    external: true
