version: "3.8"
services:
  frontend-next:
    build:
      context: .
      args:
        - NEXT_PUBLIC_APP_URL=https://linkcharts.com.br
        - NEXT_PUBLIC_REDIRECT_URL=https://redirect.linkcharts.com.br
        - NEXT_PUBLIC_GA_ID
        - NEXT_PUBLIC_GOOGLE_ADS_ID=AW-18126255245
        - NEXT_PUBLIC_ADSENSE_CLIENT
        - NEXT_PUBLIC_ADSENSE_PUBLISHER_ID=ca-pub-1396026257166470
        - NEXT_PUBLIC_SUBDOMAINS_ENABLED=true
        # Grafana Faro RUM collector — non-secret (ships in the client bundle).
        - NEXT_PUBLIC_FARO_URL=https://faro-collector-prod-sa-east-1.grafana.net/collect/01e9dc26e022b00b11c49c286fcdc03d
        - NEXT_PUBLIC_FARO_APP_NAME=linkcharts-frontend
        # API_URL é build arg porque next.config.ts rewrites() é avaliado em build time
        - API_URL=http://linkchartapi:80
    container_name: linkcharts-frontend-next-prod
    restart: always
    ports:
      - "3000:3000"
    networks:
      - frontend-net
      - linkcharts-network
    environment:
      - NODE_ENV=production
      - API_URL=http://linkchartapi:80
      - GOOGLE_SAFE_BROWSING_KEY
      - HOSTNAME=0.0.0.0
      # Auth0 — server-side only, never baked into the bundle
      - APP_BASE_URL=https://linkcharts.com.br
      - AUTH0_DOMAIN=login.linkcharts.com.br
      - AUTH0_CLIENT_ID=ynlcwMzBjCPt3qzTRLv4VyP5CkgSREzD
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_SECRET=${AUTH0_SECRET}
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  frontend-net:
    driver: bridge
  linkcharts-network:
    external: true
