version: '3.8'
services:
  frontend-next:
    build:
      context: .
      args:
        - NEXT_PUBLIC_APP_URL=https://www.linkcharts.com.br
        - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID:-}
        - NEXT_PUBLIC_ADSENSE_CLIENT=${NEXT_PUBLIC_ADSENSE_CLIENT:-}
        # API_URL é build arg porque next.config.ts rewrites() é avaliado em build time
        - API_URL=http://host.docker.internal:8000
    container_name: linkcharts-frontend-next-prod
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - API_URL=http://host.docker.internal:8000
      - GOOGLE_SAFE_BROWSING_KEY=${GOOGLE_SAFE_BROWSING_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
